# ==============================================================================
# Stack de Serviços
# ==============================================================================

name: ${PROJECT}-${ENVIRONMENT}

services:
  # ============================================================================
  # INIT - Cria estrutura de pastas com permissoes corretas
  # ============================================================================
  init:
    image: busybox:latest
    command: |
      sh -c "
        mkdir -p /data/postgres &&
        mkdir -p /data/n8n &&
        mkdir -p /data/caddy/data &&
        mkdir -p /data/caddy/config &&
        chmod -R 777 /data/postgres &&
        chmod -R 777 /data/n8n &&
        chmod -R 777 /data/caddy &&
        echo 'Init complete'
      "
    volumes:
      - ./data:/data
    restart: "no"

  # ============================================================================
  # POSTGRESQL
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      # Usa postgres como superuser padrão. O script init cria o user admin.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      internal:
        aliases:
          - postgres.internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # POSTGRES INIT - Cria databases, schemas, tabelas e seeds
  # ============================================================================
  postgres-init:
    build:
      context: .
      dockerfile: docker/postgres-init/Dockerfile
    image: postgres-init:${ENVIRONMENT}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      POSTGRES_HOST: postgres.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal
    restart: "no"

  # ============================================================================
  # N8N - Workflows auxiliares
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres.internal
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB_MAIN}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.internal:5432/${POSTGRES_DB_MAIN}
      PUBLIC_URL: ${PUBLIC_URL}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
    networks:
      internal:
        aliases:
          - n8n.internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # N8N INIT - Importa workflows automaticamente
  # ============================================================================
  n8n-init:
    image: node:18-alpine
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./scripts/init-n8n.mjs:/app/init-n8n.mjs:ro
      - ./workflows:/app/workflows:ro
    environment:
      - N8N_HOST=n8n.internal
      - N8N_PORT=5678
      - N8N_ADMIN_EMAIL=${N8N_ADMIN_EMAIL:-admin@n8n.internal}
      - N8N_ADMIN_PASSWORD=${N8N_ADMIN_PASSWORD:-admin}
      - WORKFLOWS_DIR=/app/workflows
    working_dir: /app
    command: node init-n8n.mjs
    networks:
      - internal
    restart: "no"

  # ============================================================================
  # CADDY - Reverse Proxy
  # ============================================================================
  # Rotas:
  #   /              → /landing (rewrite)
  #   /health        → backbone (unificado)
  #   /landing/*     → Landing
  #   /hub/*         → Hub
  #   /backbone/*    → Backbone
  #   /workflows/*   → N8N
  #
  # Em dev: upstreams apontam para host.docker.internal (apps no host)
  # Em prod: upstreams apontam para *.internal (apps no Docker)
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge
